version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:8080"
    environment:
      - FLASK_ENV=production
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
